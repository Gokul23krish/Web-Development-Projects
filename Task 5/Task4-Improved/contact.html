<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Cascade Blog</title>
  <meta name="description" content="Contact the Cascade Blog for feedback, ideas, or collaboration." />
  <meta name="theme-color" content="#0b0f14">
  <link rel="canonical" href="https://www.maincrafts.com/task4/contact.html">

  <!-- Open Graph / Twitter -->
  <meta property="og:title" content="Contact — Cascade Blog">
  <meta property="og:description" content="Contact the Cascade Blog for feedback, ideas, or collaboration.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.maincrafts.com/task4/contact.html">
  <meta property="og:image" content="https://images.unsplash.com/photo-1487014679447-9f8336841d58?auto=format&fit=crop&w=1600&q=60">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/styles.min.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" role="banner">
    <div class="container navbar">
      <a class="brand" href="index.html" aria-label="Cascade Blog Home">
        <span class="brand-logo" aria-hidden="true"></span>
        <span class="brand-name">Cascade Blog</span>
      </a>
      <nav class="nav-links" id="primaryNav" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="blog.html">Blog</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
      <button class="nav-toggle" aria-controls="primaryNav" aria-expanded="false" aria-label="Toggle navigation">☰</button>
    </div>
  </header>

  <main id="main" class="container">
    <section class="hero">
      <div class="hero-card">
        <h1>Contact</h1>
        <p>Have feedback or ideas? Send a quick message below.</p>
      </div>
    </section>

    <section aria-labelledby="contact-form-title">
      <h2 id="contact-form-title" class="sr-only">Contact form</h2>
      <form id="contactForm" class="form" novalidate>
        <div>
          <label for="name">Name</label>
          <input class="input" type="text" id="name" name="name" placeholder="Your name" required aria-required="true" autocomplete="name" />
        </div>
        <div>
          <label for="email">Email</label>
          <input class="input" type="email" id="email" name="email" placeholder="you@example.com" required aria-required="true" autocomplete="email" />
        </div>
        <div>
          <label for="message">Message</label>
          <textarea class="textarea" id="message" name="message" placeholder="How can we help?" required aria-required="true" rows="6"></textarea>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
          <button class="button" type="submit">Send Message</button>
          <span id="formStatus" aria-live="polite" role="status" style="display:none; color:#9ca3af;"></span>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container">
      © 2025 Cascade. Built for the Front‑End Multi‑Page Blog Task.
    </div>
  </footer>

  <script src="../assets/js/main.min.js" defer></script>
</body>
</html>
